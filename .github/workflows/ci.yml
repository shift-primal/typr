# Checks, image, migrate, deploy, smoke check (spec 0001).
# PRs run checks only, with no secrets. Pushes to main also ship to production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/typr" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # The only job holding the prod token (an environment secret on `production`).
    environment: production
    concurrency: deploy-production
    env:
      APP_ENV: production
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_URL: https://typr.haugestol.com
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrations run before the new version starts; if this fails the deploy never happens.
      - name: Migrate database
        run: |
          if [ -f drizzle/meta/_journal.json ]; then
            pnpm db:migrate
          else
            echo "No migrations yet, skipping."
          fi

      - name: Trigger Coolify deploy
        run: |
          # shellcheck disable=SC2016 # expanded by the child shell, after varlock injects the secrets
          pnpm exec varlock run -- sh -c 'curl -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$COOLIFY_WEBHOOK_URL" > /dev/null'

      - name: Smoke check
        run: |
          for _ in $(seq 1 60); do
            version=$(curl -fsS "$APP_URL/api/health" | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Live at $GITHUB_SHA"
              curl -fsS "$APP_URL/api/health/db"
              exit 0
            fi
            sleep 5
          done
          echo "New version did not report healthy within 5 minutes (last seen: ${version:-none})"
          exit 1
